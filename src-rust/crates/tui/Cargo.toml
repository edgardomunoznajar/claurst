[package]
name = "simon-tui"
version.workspace = true
edition.workspace = true

[features]
# UI & Interaction features (pass-through from cc-core)
token_budget = ["simon-core/token_budget"]
ultraplan = ["simon-core/ultraplan"]
ultrathink = ["simon-core/ultrathink"]
history_picker = ["simon-core/history_picker"]
message_actions = ["simon-core/message_actions"]
quick_search = ["simon-core/quick_search"]
away_summary = ["simon-core/away_summary"]
hook_prompts = ["simon-core/hook_prompts"]
kairos_brief = ["simon-core/kairos_brief"]
kairos_channels = ["simon-core/kairos_channels"]
lodestone = ["simon-core/lodestone"]

# Agents & Memory features (pass-through from cc-core)
agent_triggers = ["simon-core/agent_triggers"]
agent_triggers_remote = ["simon-core/agent_triggers_remote"]
extract_memories = ["simon-core/extract_memories"]
verification_agent = ["simon-core/verification_agent"]
builtin_explore_plan_agents = ["simon-core/builtin_explore_plan_agents"]
cached_microcompact = ["simon-core/cached_microcompact"]
compaction_reminders = ["simon-core/compaction_reminders"]
agent_memory_snapshot = ["simon-core/agent_memory_snapshot"]
teammem = ["simon-core/teammem"]

# Tools & Infrastructure features (pass-through from cc-core)
bash_classifier = ["simon-core/bash_classifier"]
bridge_mode = ["simon-core/bridge_mode"]
mcp_rich_output = ["simon-core/mcp_rich_output"]
connector_text = ["simon-core/connector_text"]
unattended_retry = ["simon-core/unattended_retry"]
new_init = ["simon-core/new_init"]
powershell_auto_mode = ["simon-core/powershell_auto_mode"]
shot_stats = ["simon-core/shot_stats"]
tree_sitter_bash = ["simon-core/tree_sitter_bash"]
tree_sitter_bash_shadow = ["simon-core/tree_sitter_bash_shadow"]
native_clipboard_image = ["simon-core/native_clipboard_image"]
prompt_cache_break_detection = ["simon-core/prompt_cache_break_detection"]
ccr_auto_connect = ["simon-core/ccr_auto_connect"]
ccr_mirror = ["simon-core/ccr_mirror"]
ccr_remote_setup = ["simon-core/ccr_remote_setup"]

[dependencies]
simon-core = { workspace = true }
simon-api = { workspace = true }
simon-tools = { workspace = true }
simon-query = { workspace = true }
simon-mcp = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
similar = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
once_cell = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
dashmap = { workspace = true }
icy_sixel = { workspace = true }
image = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
